name: Publish Gradle Plugin

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.release.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6

      # Required repository secrets: GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET.
      - name: Validate release credentials and version
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ -z "${GRADLE_PUBLISH_KEY}" || -z "${GRADLE_PUBLISH_SECRET}" ]]; then
            echo "GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET must be configured." >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          if [[ ! "${RELEASE_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag '${RELEASE_TAG}' is not a valid version tag." >&2
            exit 1
          fi
          if [[ "${release_version}" =~ [Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt] ]]; then
            echo "Snapshot release tags cannot be published." >&2
            exit 1
          fi

          project_version="$(./gradlew --no-daemon -q :infokotlinprocess:properties | sed -n 's/^version: //p' | tail -n 1)"
          if [[ -z "${project_version}" || "${project_version}" =~ [Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt] ]]; then
            echo "Project version '${project_version}' is missing or a snapshot." >&2
            exit 1
          fi
          if [[ "${project_version}" != "${release_version}" ]]; then
            echo "Release tag '${RELEASE_TAG}' does not match project version '${project_version}'." >&2
            exit 1
          fi

      - name: Validate plugin before upload
        run: ./gradlew --no-daemon :infokotlinprocess:check :infokotlinprocess:validatePlugins

      - name: Publish plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew --no-daemon publishPlugins
